<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- 
       ╔══════════════════════════════════════╗
       ║    XAN XEO CHAY TUI v1.1 - 31/01/2026 ║
       ║    Affiliate ID: 17314740041          ║
       ║    Fix: Emoji text bug mobile         ║
       ╚══════════════════════════════════════╝ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xăn Xeo Cháy Túi ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* QUICK EDIT:
           Tên: .logo-text  
           Màu: --purple-500 
           ID: AFFILIATE_ID */
        :root {
            --purple-500: #8b5cf6; --purple-600: #7c3aed;
            --glass-bg: rgba(255,255,255,0.1); --glass-border: rgba(255,255,255,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 20px; 
        }
        .container { 
            background: var(--glass-bg); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 24px; 
            padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            max-width: 420px; width: 100%; 
        }
        .header { text-align: center; margin-bottom: 32px; }
        .logo { 
            font-size: 32px; font-weight: 700; color: white; /* FIX: bỏ gradient */
            text-shadow: 0 2px 10px rgba(0,0,0,0.3); /* Thêm shadow đẹp */
            margin-bottom: 8px;
        }
        .fire { color: #fbbf24; margin-left: 8px; } /* 🔥 emoji riêng */
        .title { font-size: 16px; color: rgba(255,255,255,0.9); font-weight: 500; }
        .input-group { position: relative; margin-bottom: 24px; }
        .input-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,0.9); margin-bottom: 12px; font-weight: 500; }
        input[type="url"] { width: 100%; padding: 18px 20px 18px 50px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; font-size: 16px; color: white; backdrop-filter: blur(10px); transition: all 0.3s ease; }
        input::placeholder { color: rgba(255,255,255,0.6); }
        input:focus { outline: none; border-color: var(--purple-500); box-shadow: 0 0 0 4px rgba(139,92,246,0.2); transform: translateY(-2px); }.btn { width: 100%; padding: 18px; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-bottom: 12px; }
        .btn-primary { background: linear-gradient(135deg, var(--purple-500), var(--purple-600)); color: white; box-shadow: 0 10px 30px rgba(139,92,246,0.4); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(139,92,246,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
        .result { margin-top: 24px; padding: 24px; background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.3); border-radius: 16px; display: none; text-align: center; backdrop-filter: blur(10px); }
        .result.show { display: block; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        #shortUrl { color: #10b981; text-decoration: none; font-weight: 600; font-size: 14px; word-break: break-all; display: block; margin-top: 12px; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 12px; }
        .success-icon { font-size: 32px; color: #10b981; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <span>Xăn Xeo Cháy Túi</span><span class="fire">🔥</span>
            </div>
            <div class="title"><i class="fas fa-tags"></i> Voucher Shopee</div>
        </div>
        
        <div class="input-group">
            <label class="input-label"><i class="fas fa-link"></i> Dán link sản phẩm</label>
            <input type="url" id="inputLink" placeholder="https://shopee.vn/tên-sản-phẩm...">
        </div>
        
        <button class="btn btn-primary" onclick="generateShortLink()">
            <i class="fas fa-magic"></i> Mua ngay voucher
        </button>
        <button class="btn btn-secondary" id="btnCopy" onclick="copyLink()" style="display: none;">
            <i class="fas fa-copy"></i> Sao chép link
        </button>
        
        <div id="result" class="result">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <strong>Link siêu ngắn ready! 🚀</strong><br>
            <a id="shortUrl" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        const AFFILIATE_ID = '17314740041'; // ĐỔI ID Ở ĐÂY
        
        function extractItemShopId(url) {
            const patterns = [/i\.(\d+)\.(\d+)/g, /\/i(\d+)\.(\d+)/g, /itemid=(\d+)&shopid=(\d+)/g, /product\/(\d+)\/(\d+)/g];
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) return `${match[1]}.${match[2]}`;
            }return null;
        }
        
        function generateShortLink() {
            const input = document.getElementById('inputLink').value.trim();
            if (!input || !input.includes('shopee')) {
                alert('🎯 Dán link Shopee sản phẩm nha!');
                return;
            }
            const itemShopId = extractItemShopId(input);
            if (!itemShopId) {
                alert('🔍 Không nhận diện được ID!\nVí dụ: shopee.vn/tên-i123456789.987654321');
                return;
            }
            const trackingLink = `https://s.shopee.vn/an_redir?origin_link=https%3A%2F%2Fshopee.vn%2F${itemShopId}&affiliate_id=${AFFILIATE_ID}&sub_id=xanxeo-tool`;
            document.getElementById('shortUrl').href = trackingLink;
            document.getElementById('shortUrl').textContent = `shopee.vn/${itemShopId}`;
            document.getElementById('result').classList.add('show');
            document.getElementById('btnCopy').style.display = 'block';
            document.getElementById('inputLink').value = '';
        }
        
        function copyLink() {
            const link = document.getElementById('shortUrl').href;
            navigator.clipboard.writeText(link).then(() => alert('✨ Link copy rồi! Share kiếm tiền 💸'));
        }
        
        document.getElementById('inputLink').addEventListener('keypress', e => e.key === 'Enter' && generateShortLink());
    </script>
</body>
</html>
